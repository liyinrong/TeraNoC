package:
  name: mempool

dependencies:
  axi:                  { git: "https://github.com/pulp-platform/axi.git",                  version: 0.39.11 }
  cluster_interconnect: { git: "https://github.com/pulp-platform/cluster_interconnect.git", version: 1.3.0   }
  common_cells:         { git: "https://github.com/pulp-platform/common_cells.git",         version: 1.40.0  }
  idma:                 { git: "https://github.com/pulp-platform/iDMA.git",                 version: 0.6.5   }
  register_interface:   { git: "https://github.com/pulp-platform/register_interface.git",   version: 0.4.7   }
  reqrsp_interface:     { path: "hardware/deps/reqrsp_interface"                                             }
  snitch:               { path: "hardware/deps/snitch"                                                       }
  # Upstream Spatz VPU with the TeraNoC burst path (branch teranoc-new). This is
  # the only Spatz in this configuration -- the vendored fork is not built here.
  spatz_vpu:            { git: "https://github.com/liyinrong/spatz_vpu.git",                rev: 8b46477     }
  cluster_icache:       { git: "https://github.com/pulp-platform/cluster_icache.git",       version: 0.3.1   }
  tech_cells_generic:   { git: "https://github.com/pulp-platform/tech_cells_generic.git",   version: 0.2.14  }
  fpnew:                { git: "https://github.com/pulp-platform/cvfpu.git",                rev: pulp-v0.3.0 }
  floo_noc:             { git: "https://github.com/pulp-platform/FlooNoC.git",              version: 0.8.4   }
  scm:                  { path: "hardware/deps/scm"                                                          }
  redmule:              { git: "https://github.com/liyinrong/redmule.git",                  rev: yinrong/devel }
  hci:                  { git: "https://github.com/pulp-platform/hci.git",                  version: 2.6.1   }
  fractal_sync:         { git: "https://github.com/VictorIsachi/fractal_sync.git",         rev: df8e21b7e2b0e2d3198bf44a60b4ca67c334bcc2 }

workspace:
  checkout_dir: "./hardware/deps"

export_include_dirs:
  - hardware/include
  - hardware/tb

sources:
  # Level 0
  - hardware/src/mempool_pkg.sv
  - hardware/src/fsync_shim.sv
  - hardware/src/mempool_idma_group.sv
  - target: spatz
    files:
    - hardware/src/tcdm_id_remapper.sv
  - hardware/src/axi_hier_interco.sv
  - hardware/src/mempool_cc.sv
  - hardware/src/snitch_addr_demux.sv
  - hardware/src/snitch_hwpe_cfg_adapter.sv
  - hardware/src/tcdm_adapter.sv
  - hardware/src/tcdm_shim.sv
  - hardware/src/mempool_addr_scrambler.sv
  - hardware/src/mempool_tcdm_wide_superbank.sv
  - hardware/src/mempool_tcdm_bank_interco.sv
  - hardware/src/axi_L2_interleaver.sv
  - hardware/src/bootrom_image_pkg.sv
  - hardware/src/bootrom.sv
  - hardware/src/selector.sv
  - hardware/src/mempool_tile_remote_req_router.sv
  - hardware/src/transactions_table.sv
  - hardware/src/control_registers/control_registers_reg_pkg.sv
  - hardware/src/control_registers/control_registers_reg_top.sv
  # Level 1
  - hardware/src/spatz_local_burst_expander.sv
  - hardware/src/spatz_wide_burst_adapter.sv
  - hardware/src/mempool_tile.sv
  # Level 2
  - hardware/src/floo_remapper.sv
  - hardware/src/routing_table_pkg.sv
  - hardware/src/mempool_group.sv
  - hardware/generated/floo_terapool_noc_pkg.sv
  - hardware/generated/l2_bank_map_pkg.sv
  - hardware/src/mempool_group_floonoc_wrapper.sv
  # Level 3
  - hardware/src/mempool_cluster_floonoc_wrapper.sv
  - hardware/src/terapool_cluster_floonoc_wrapper.sv
  # Level 4
  - hardware/src/ctrl_registers.sv
  # Level 5
  - hardware/src/mempool_system.sv

  - target: mempool_vsim
    files:
      # Level 0
      - hardware/src/mempool_pkg.sv
      # Level 1
      - hardware/tb/axi_uart.sv
      - hardware/tb/traffic_generator.sv
      # Standalone WP3 permuter replay. Compiled with the design so `make
      # vc-replay` can elaborate it as an alternative top; it was in no target
      # at all before, which meant the golden-vector gate could not be run.
      - hardware/tb/tb_vc_scrambler.sv
      # Standalone fractal_sync barrier gate: safety (no wake on a partial
      # set) and isolation (disjoint scopes do not see each other), driven
      # at the tree's leaf ports with no cores and no shim.
      - hardware/tb/tb_fractal_sync.sv
      # Shim driven only through its software-visible trigger, against a
      # real tree: covers id steering, wake broadcast and one-outstanding.
      - hardware/tb/tb_fsync_shim.sv
      # Level 2
      - hardware/tb/mempool_tb.sv
      # DRAMsys
      - hardware/deps/dram_rtl_sim/src/sim_dram.sv
      - hardware/deps/dram_rtl_sim/src/axi_dram_sim.sv
      - hardware/deps/dram_rtl_sim/src/dram_sim_engine.sv

  - target: mempool_verilator
    files:
      # Level 1
      - hardware/tb/axi_uart.sv
      - hardware/tb/traffic_generator.sv
      # Level 2
      - hardware/tb/mempool_tb_verilator.sv

  - target: fpga
    files:
      # Level 1
    - hardware/src/axi_rab_wrap.sv
