    dst_idx: [6, 0]
    dst_dir: "South"
  - src: "hbm21"
    dst: "group_router"
    dst_idx: [7, 3]
    dst_dir: "East"
  - src: "hbm22"
    dst: "group_router"
    dst_idx: [7, 5]
    dst_dir: "East"
  - src: "hbm23"
    dst: "group_router"
    dst_idx: [6, 7]
    dst_dir: "North"
  - src: "hbm24"
